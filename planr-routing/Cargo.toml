[package]
name = "planr-routing"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Official model-routing policy compiler for Planr"
repository = "https://github.com/instructa/planr"
rust-version = "1.85"
exclude = ["node_modules/**", "dist/**"]

[[bin]]
name = "planr-routing"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
