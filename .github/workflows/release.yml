name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: version
        run: |
          node scripts/check-version.mjs "$RELEASE_TAG"
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          node scripts/changelog-notes.mjs "${RELEASE_TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: node --test
      - run: node scripts/package-smoke.mjs

  github-release:
    needs: verify
    if: github.repository == 'instructa/planr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          response="$RUNNER_TEMP/github-release-response.txt"
          error="$RUNNER_TEMP/github-release-error.txt"
          if gh api --include "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$response" 2> "$error"; then
            echo "GitHub release $RELEASE_TAG already exists; leaving it unchanged"
            exit 0
          fi
          if ! grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$response"; then
            cat "$error" >&2
            exit 1
          fi
          node scripts/changelog-notes.mjs "${RELEASE_TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"

  npm:
    needs: [verify, github-release]
    if: github.repository == 'instructa/planr' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Publish with npm Trusted Publishing (OIDC)
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          node scripts/check-version.mjs "$RELEASE_TAG"
          response="$RUNNER_TEMP/npm-view.json"
          error="$RUNNER_TEMP/npm-view-error.txt"
          if npm view "planr@${RELEASE_TAG#v}" version --json > "$response" 2> "$error"; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const actual = JSON.parse(readFileSync(process.argv[1]));
              if (actual !== process.env.RELEASE_TAG.slice(1)) {
                throw Error("npm view returned an unexpected version");
              }
            ' "$response"
            echo "planr@${RELEASE_TAG#v} already published; skipping npm publish"
            exit 0
          fi
          if ! node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.argv[1]));
            process.exit(result.error?.code === "E404" ? 0 : 1);
          ' "$response"; then
            cat "$response" "$error" >&2
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            if (JSON.parse(readFileSync("package.json")).private) {
              throw Error("Remove private only in the approved release commit");
            }
          '
          if [[ "$RELEASE_TAG" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public --tag latest
          fi

  homebrew:
    needs: [verify, npm]
    if: >-
      github.repository == 'instructa/planr' &&
      vars.HOMEBREW_TAP_ENABLED == 'true' &&
      !contains(needs.verify.outputs.tag, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Wait for the published tarball and write the formula
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          for attempt in {1..10}; do
            if node scripts/homebrew-formula.mjs "${RELEASE_TAG#v}" "$RUNNER_TEMP/planr.rb"; then
              exit 0
            fi
            if [[ "$attempt" -lt 10 ]]; then
              sleep 15
            fi
          done
          echo 'Published npm tarball was not available after 10 attempts' >&2
          exit 1
      - name: Update the Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/instructa/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp "$RUNNER_TEMP/planr.rb" tap/Formula/planr.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/planr.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "planr ${RELEASE_TAG#v}"
          git push
