[package]
name = "planr"
version = "1.10.0-alpha.4"
edition = "2024"
license = "MIT"
description = "Local-first planning and execution coordination for coding agents"
repository = "https://github.com/instructa/planr"
homepage = "https://github.com/instructa/planr"
readme = "README.md"
keywords = ["planning", "agents", "mcp", "cli", "task-graph"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[[bin]]
name = "planr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cliclack = "0.5.4"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
libc = "0.2"
jsonschema = { version = "0.49.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
slug = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
